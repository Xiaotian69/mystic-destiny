<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1600, initial-scale=1">
  <title>Mystic Destiny hero</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1600px; height: 720px; overflow: hidden; }
    body {
      color: #f7efdd;
      font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 79% 28%, rgba(113, 61, 175, .3), transparent 34%),
        radial-gradient(circle at 18% 88%, rgba(200, 169, 81, .12), transparent 30%),
        linear-gradient(128deg, #100720 0%, #1a1033 47%, #0b0618 100%);
    }
    .canvas { position: relative; width: 100%; height: 100%; padding: 72px 88px; isolation: isolate; }
    .canvas::before {
      content: ""; position: absolute; inset: 0; z-index: -1; opacity: .52;
      background-image:
        linear-gradient(rgba(200, 169, 81, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200, 169, 81, .035) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(90deg, #000, transparent 72%);
    }
    .orbit { position: absolute; border: 1px solid rgba(200, 169, 81, .19); border-radius: 50%; }
    .orbit.a { width: 430px; height: 430px; left: -148px; top: -214px; }
    .orbit.b { width: 650px; height: 650px; right: -245px; bottom: -385px; }
    .orbit.c { width: 188px; height: 188px; left: 661px; bottom: -91px; }
    .star { position: absolute; color: #d8bd6a; font-size: 13px; line-height: 1; opacity: .9; }
    .s1 { left: 58px; top: 300px; } .s2 { left: 762px; top: 86px; font-size: 9px; }
    .s3 { right: 61px; top: 92px; } .s4 { left: 718px; bottom: 84px; font-size: 17px; }
    .s5 { left: 548px; top: 140px; font-size: 7px; opacity: .55; }
    .copy { position: relative; width: 690px; padding-top: 24px; z-index: 3; }
    .eyebrow { color: #c8a951; font-size: 18px; font-weight: 700; letter-spacing: 5px; }
    h1 { margin: 28px 0 22px; font-family: Georgia, "Times New Roman", "Songti SC", serif; font-size: 66px; line-height: 1.08; font-weight: 500; letter-spacing: -1.2px; }
    h1 span { display: block; margin-top: 11px; color: #dcc574; font-size: 50px; letter-spacing: 5px; }
    .rule { display: flex; align-items: center; gap: 12px; width: 408px; margin: 27px 0; color: #c8a951; }
    .rule::before, .rule::after { content: ""; height: 1px; flex: 1; background: linear-gradient(90deg, transparent, rgba(200,169,81,.72)); }
    .rule::after { transform: scaleX(-1); }
    .tagline { margin: 0; color: rgba(247, 239, 221, .82); font-family: Georgia, serif; font-size: 25px; letter-spacing: .5px; }
    .features { margin-top: 22px; color: rgba(216, 189, 106, .86); font-size: 17px; letter-spacing: 2px; }
    .screens { position: absolute; inset: 0; pointer-events: none; }
    .phone { position: absolute; overflow: hidden; background: #130925; border: 1px solid rgba(216,189,106,.54); border-radius: 28px; box-shadow: 0 28px 70px rgba(0,0,0,.52); }
    .phone::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 6px rgba(12,6,30,.66); }
    .phone img { width: 100%; height: 100%; object-fit: cover; }
    .phone.home { width: 292px; height: 632px; right: 337px; top: 74px; transform: rotate(-3.2deg); z-index: 2; }
    .phone.tarot { width: 265px; height: 573px; right: 92px; top: 124px; transform: rotate(3.6deg); z-index: 3; }
    .phone.calendar { width: 229px; height: 495px; right: 537px; top: 165px; transform: rotate(-8deg); z-index: 1; opacity: .82; }
    .seal { position: absolute; right: 648px; top: 70px; width: 84px; height: 84px; display: grid; place-items: center; border: 1px solid rgba(216,189,106,.55); border-radius: 50%; color: #d8bd6a; font-family: Georgia, serif; font-size: 30px; transform: rotate(9deg); }
    .seal::before { content: ""; position: absolute; inset: 7px; border: 1px solid rgba(216,189,106,.25); border-radius: 50%; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="orbit a"></div><div class="orbit b"></div><div class="orbit c"></div>
    <i class="star s1">✦</i><i class="star s2">✦</i><i class="star s3">✦</i><i class="star s4">✦</i><i class="star s5">✦</i>
    <section class="copy">
      <div class="eyebrow">MYSTIC DESTINY · 命理星象</div>
      <h1>Ancient symbols.<br>Modern interaction.<span>命理星象</span></h1>
      <div class="rule">✦</div>
      <p class="tagline">Fortune · Tarot · Astrology · AI interpretation</p>
      <p class="features">A browser-first H5 experience</p>
    </section>
    <section class="screens" aria-label="Product screenshots">
      <div class="seal">星</div>
      <figure class="phone calendar"><img src="screenshots/fortune-calendar.png" alt="Fortune calendar"></figure>
      <figure class="phone home"><img src="screenshots/mobile-home.png" alt="Daily fortune home"></figure>
      <figure class="phone tarot"><img src="screenshots/tarot-reading.png" alt="Tarot reading"></figure>
    </section>
  </main>
</body>
</html>
